<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Workshop has ended | Agentic AI workshop</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #242c26;
      background: #f6f3ec;
      line-height: 1.6;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(1.25rem, 5vw, 3rem);
    }
    main { width: 100%; max-width: 35rem; }
    .workshop {
      margin: 0 0 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #858c7e;
      color: #5e665d;
      font-size: .875rem;
    }
    h2 {
      margin: 0 0 1.25rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.1rem, 7vw, 3rem);
      font-weight: 400;
      line-height: 1.2;
    }
    p { margin: 0 0 1.25rem; }
    a { color: #284b3d; text-underline-offset: .2em; }
    a:focus-visible { outline: 3px solid #956031; outline-offset: 4px; }
    @media (prefers-color-scheme: dark) {
      :root { color: #eceee6; background: #1b211e; }
      .workshop { color: #b6beb4; border-color: #626e63; }
      a { color: #b7d8c5; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="heading">
    <p class="workshop">Agentic AI workshop · 2026</p>
    <h2 id="heading">Workshop has ended</h2>
    <p>This link no longer works. The class portal and hosted apps have been retired.</p>
    <p>Thank you for being part of the workshop.</p>
    <p><a href="https://adityasinghal.com/agentic-ai-workshop-2026/">Course materials and recordings</a></p>
  </main>
</body>
</html>
